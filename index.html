<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EnglishPro – Học tiếng Anh mỗi ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#D9F0FF;--dot:rgba(79,91,255,.16);--pp:#FFFFFF;--tx:#1B1340;--ink:#1B1340;--mu:#5B5883;--ln:#1B1340;--lk:#1B1340;--sd:#1B1340;--soft:#E7EEFF;
--blue:#4F5BFF;--mint:#3FE0A8;--sun:#FFD23F;--coral:#FF6B6B;--lil:#B28DFF;--pink:#FF8FD0;--sky:#7AD7FF;
--pri:#4F5BFF;--prif:#FFFFFF;--hero:#FFD23F;--fo:#4F5BFF;--bw:3px;--sh:4px 6px 0 var(--sd);
--fd:"Baloo 2","Nunito",system-ui,sans-serif;--fe:"Bangers","Baloo 2",cursive;--fb:"Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#17123A;--dot:rgba(255,255,255,.07);--pp:#262057;--tx:#F5F2FF;--mu:#B3AEDD;--ln:#6F66D8;--lk:#F5F2FF;--sd:#0A0720;--soft:#332C74;--pri:#FFD23F;--prif:#1B1340;--hero:#4F5BFF;--fo:#FFD23F}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);font-weight:600;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.4px,transparent 3px);background-size:24px 24px;color:var(--tx);line-height:1.55;font-size:16px;min-height:100vh;padding-bottom:120px;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--fo);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--fd);font-weight:800;line-height:1.08;letter-spacing:-.005em}
h1{font-size:clamp(36px,6.4vw,62px);margin-bottom:10px}
h2{display:inline-block;font-size:clamp(20px,3vw,27px);margin:42px 0 20px;padding:5px 18px 1px;background:var(--sun);color:var(--ink);border:var(--bw) solid var(--lk);border-radius:14px;box-shadow:4px 4px 0 var(--sd);transform:rotate(-1.5deg)}
h3{font-size:21px}
.sub{color:var(--mu);max-width:62ch;margin-bottom:26px;font-weight:700}
.hint{color:var(--mu);font-size:14.5px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.cmx{font-family:var(--fe);font-weight:400;letter-spacing:.03em;color:#fff;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),6px 7px 0 var(--ink)}
.doodles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.doodles i{position:absolute;opacity:.55;animation:float var(--t) ease-in-out var(--d) infinite alternate}
.doodles svg{display:block;width:100%;height:100%}
@keyframes float{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-26px) rotate(10deg)}}
#top,main{position:relative;z-index:2}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,4vw,40px);max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .bm{width:50px;height:50px;flex-shrink:0}
.brand .bm svg{width:100%;height:100%;display:block}
.brand span{font-family:var(--fe);font-size:34px;letter-spacing:.04em;color:var(--sun);text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),4px 5px 0 var(--ink);transform:rotate(-2deg);display:inline-block}
.tools{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border:var(--bw) solid var(--lk);border-radius:99px;background:var(--pp);font-family:var(--fd);font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--sd);transition:transform .12s}
.chip svg{color:var(--coral)}
.chip:hover{animation:jelly .5s}
.ib{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--lk);background:var(--pp);display:grid;place-items:center;box-shadow:0 4px 0 var(--sd);transition:transform .12s}
.ib:hover{transform:rotate(-14deg) scale(1.08)}
.ib:active{transform:translateY(4px);box-shadow:0 0 0 var(--sd)}
main{max-width:1240px;margin:0 auto;padding:10px clamp(14px,4vw,40px) 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:17px;border:var(--bw) solid var(--lk);background:var(--pri);color:var(--prif);font-family:var(--fd);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--sd);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sd);animation:jelly .45s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--sd);animation:none}
.btn.gh{background:var(--pp);color:var(--tx)}
.btn.ok{background:var(--mint);color:var(--ink)}
.btn.ko{background:var(--coral);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sm{min-height:42px;padding:0 18px;font-size:15px;box-shadow:0 4px 0 var(--sd);border-radius:14px}
.btn.lg{min-height:60px;font-size:21px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
@keyframes jelly{0%{scale:1 1}30%{scale:1.07 .93}50%{scale:.96 1.05}70%{scale:1.03 .98}100%{scale:1 1}}
.bd{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:99px;border:2.5px solid var(--lk);font-size:13.5px;font-weight:800;background:var(--pp);color:var(--tx);white-space:nowrap}
.bd.a1,.bd.a2{background:var(--mint);color:var(--ink)}
.bd.b1,.bd.b2{background:var(--sun);color:var(--ink)}
.bd.c1,.bd.c2{background:var(--lil);color:var(--ink)}
.bd.hot{background:var(--coral);color:var(--ink)}
.bd.mid{background:var(--sky);color:var(--ink)}
.bd.low{background:var(--soft);color:var(--tx)}
.m5{display:inline-flex;gap:3px;align-items:flex-end;height:17px;vertical-align:middle;margin-left:5px}
.m5 i{width:6px;border-radius:3px;background:var(--soft);border:1.5px solid var(--ln)}
.m5 i:nth-child(1){height:6px}.m5 i:nth-child(2){height:9px}.m5 i:nth-child(3){height:12px}.m5 i:nth-child(4){height:15px}.m5 i:nth-child(5){height:17px}
.m5.u i.on{background:var(--blue);border-color:var(--lk)}
.m5.x i.on{background:var(--coral);border-color:var(--lk)}
input[type=text],input[type=search],select{min-height:50px;padding:0 16px;border:var(--bw) solid var(--lk);border-radius:16px;background:var(--pp);outline:none;min-width:0;font-weight:700;transition:box-shadow .12s}
input:focus,select:focus{box-shadow:0 5px 0 var(--sd)}
.pn{position:relative;background:var(--pp);border:var(--bw) solid var(--lk);border-radius:28px;box-shadow:var(--sh);padding:34px 22px 22px;margin-top:8px;color:var(--tx)}
.pn>*{position:relative}
.pn.sun{background:var(--sun);color:var(--ink)}
.pn.lil{background:var(--lil);color:var(--ink)}
.pn.mint{background:var(--mint);color:var(--ink)}
.pn.coral{background:#FF9A8B;color:var(--ink)}
.pn.sky{background:var(--sky);color:var(--ink)}
.pn.hero{background:var(--hero);color:var(--ink)}
[data-theme=dark] .pn.hero{color:#fff}
.pn.sun .hint,.pn.lil .hint,.pn.mint .hint,.pn.coral .hint,.pn.sky .hint{color:var(--ink);opacity:.75}
.pn.ht::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:radial-gradient(rgba(27,19,64,.2) 2.2px,transparent 2.8px);background-size:15px 15px;-webkit-mask-image:linear-gradient(120deg,transparent 45%,#000);mask-image:linear-gradient(120deg,transparent 45%,#000);pointer-events:none}
.tab{position:absolute!important;top:-18px;left:18px;padding:3px 16px 1px;background:var(--sun);color:var(--ink);border:var(--bw) solid var(--lk);border-radius:12px;font-family:var(--fd);font-weight:800;font-size:17px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--sd);z-index:2}
.pn.sun .tab{background:var(--pp)}
.home{display:grid;grid-template-columns:repeat(12,1fr);gap:30px 24px;padding-top:12px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
body.live .home>*{animation:panIn .7s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--k,0)*90ms)}
.home>*:nth-child(1){--k:0}.home>*:nth-child(2){--k:1}.home>*:nth-child(3){--k:2}.home>*:nth-child(4){--k:3}.home>*:nth-child(5){--k:4}.home>*:nth-child(6){--k:5}.home>*:nth-child(7){--k:6}.home>*:nth-child(8){--k:7}
@keyframes panIn{from{transform:translateY(46px) scale(.8) rotate(-3deg);opacity:0}}
.hero{display:flex;flex-direction:column;gap:20px;min-height:330px;justify-content:space-between;padding:36px clamp(20px,3.5vw,38px) 26px}
.hero .bd{background:var(--pp);color:var(--tx)}
.hw{font-family:var(--fe);font-weight:400;letter-spacing:.03em;font-size:clamp(58px,11vw,120px);line-height:1;color:#fff;word-break:break-word;text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),8px 9px 0 var(--ink)}
.hw span{display:inline-block;opacity:0}
body.live .hw span{opacity:1;animation:drop .8s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:calc(var(--i)*70ms + .25s)}
@keyframes drop{from{transform:translateY(-120%) rotate(-14deg) scale(.5);opacity:0}}
.hvn{font-family:var(--fd);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;margin-bottom:14px}
.mrow{display:flex;gap:10px;align-items:flex-end}
.mm{width:132px;flex:0 0 132px}
.mm.sm{width:84px;flex-basis:84px}
.mm svg,.sk-m svg{width:100%;height:auto;display:block;overflow:visible}
.mas .mb{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.mas .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97) translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bub{position:relative;background:#fff;color:var(--ink);border:var(--bw) solid var(--lk);border-radius:22px;padding:12px 16px;font-family:var(--fd);font-weight:700;font-size:18px;line-height:1.25;flex:1;margin-bottom:34px}
.bub::before{content:"";position:absolute;left:-20px;bottom:16px;border:10px solid transparent;border-right-color:var(--lk);border-left-width:0;border-width:10px 17px 10px 0}
.bub::after{content:"";position:absolute;left:-12px;bottom:18px;border-style:solid;border-width:8px 13px 8px 0;border-color:transparent #fff transparent transparent}
.mq .bub{margin-bottom:0}
.mq{display:flex;gap:10px;align-items:center;margin:4px 0 6px}
.skb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--pp);color:var(--tx);border:var(--bw) solid var(--lk);border-radius:20px;padding:8px 16px;box-shadow:0 5px 0 var(--sd);font-family:var(--fd);font-weight:800;margin-top:-14px;transition:transform .12s}
.skb:hover{animation:jelly .5s}
.skb:active{transform:translateY(5px);box-shadow:0 0 0 var(--sd)}
.skb b{font-family:var(--fe);font-weight:400;font-size:46px;line-height:1;color:var(--sun);text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),3px 4px 0 var(--ink)}
.flm{width:42px;flex-shrink:0}
.flame{display:block;width:100%;height:auto;overflow:visible;transform-box:fill-box;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
.flame .f2,.flame .f3{transform-box:fill-box;transform-origin:50% 100%;animation:flick2 .7s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(1.05,.95) rotate(1.5deg)}}
@keyframes flick2{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
.flame.out .f1{fill:#9C99BD}.flame.out .f2{fill:#C9C7DE}.flame.out .f3{fill:#fff}.flame.out{animation:none}
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stp{width:34px;height:34px;border-radius:50%;border:var(--bw) solid var(--lk);background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.stp.on{background:var(--mint);animation:stamp .5s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes stamp{from{transform:scale(2.2) rotate(-30deg);opacity:0}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fd);font-weight:800;font-size:14px}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:var(--bw) solid var(--lk);background:var(--pp);display:grid;place-items:center;font-style:normal;color:var(--ink)}
.wd i svg{width:62%;height:auto}
.wd.on i{background:var(--sun)}
.wd.td i{box-shadow:0 0 0 4px var(--coral);animation:hop 1.4s ease-in-out infinite}
.wd.fu{opacity:.55}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stk{display:grid;gap:14px}
.tks{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tk{display:grid;grid-template-columns:1fr 84px;border:var(--bw) solid var(--lk);border-radius:22px;background:var(--pp);overflow:hidden;color:var(--tx)}
.tk.due{box-shadow:var(--sh)}
.tk .mn{padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tk .mn h3{font-size:19px}
.tk .mn b{font-size:14.5px}
.tk .mn .hint{font-size:13.5px}
.tk .st{border-left:var(--bw) dashed var(--lk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fe);font-size:40px;line-height:1;background:var(--soft);color:var(--tx)}
.tk .st small{font-family:var(--fb);font-size:13px;font-weight:800;margin-top:4px}
.tk.due .st{background:var(--coral);color:var(--ink)}
.tk.rdy .st{background:var(--mint);color:var(--ink)}
.tk.due{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-1.2deg)}94%{transform:rotate(1.2deg)}}
.lv{display:grid;grid-template-columns:46px 1fr 62px;gap:10px;align-items:center;margin:11px 0;font-weight:800;font-size:14px}
.bar{height:20px;border:var(--bw) solid var(--lk);border-radius:99px;background:var(--pp);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-right:var(--bw) solid var(--lk);transition:width .9s cubic-bezier(.2,.9,.3,1.2)}
.bar i.z{border:0}
.bar i.a{background:var(--mint)}.bar i.b{background:var(--sun)}.bar i.c{background:var(--lil)}
.tiles{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.hs{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .tile{flex:0 0 200px;scroll-snap-align:start}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:150px;padding:16px;border-radius:24px;border:var(--bw) solid var(--lk);color:var(--ink);text-align:left;box-shadow:0 5px 0 var(--sd);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--sd);animation:jelly .5s}
.tile:active{transform:translateY(5px);box-shadow:0 0 0 var(--sd)}
.t0{background:#B9C2FF}.t1{background:#9BEBCB}.t2{background:#FFE17A}.t3{background:#FFB4A6}.t4{background:#D9C7FF}
.tile .em{font-size:40px;line-height:1;display:inline-block}
.tile:hover .em{animation:hop .5s}
.tile h3{font-size:20px}
.tile small{font-weight:800;font-size:14px}
.pb{height:10px;border-radius:99px;background:rgba(27,19,64,.2);margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ink);border-radius:99px}
.fl{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 14px;scrollbar-width:none}
.fl::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;height:42px;padding:0 18px;border-radius:99px;border:var(--bw) solid var(--lk);background:var(--pp);font-family:var(--fd);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--sd);transition:transform .1s,box-shadow .1s}
.pill:active{transform:translateY(4px);box-shadow:0 0 0 var(--sd)}
.pill.on{background:var(--pri);color:var(--prif)}
.card{background:var(--pp);border:var(--bw) solid var(--lk);border-radius:24px;padding:20px;box-shadow:var(--sh)}
.vl{display:grid;gap:14px;margin-top:8px}
.vr{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:16px 18px;border:var(--bw) solid var(--lk);border-radius:22px;background:var(--pp);box-shadow:0 5px 0 var(--sd)}
.vr.dn{background:color-mix(in srgb,var(--mint) 22%,var(--pp))}
.vr .w{font-family:var(--fe);font-size:30px;letter-spacing:.03em;line-height:1.1;color:var(--tx)}
.vr .vn{color:var(--mu);font-size:16px;font-weight:700;margin-top:2px}
.vr .mt{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13.5px;color:var(--mu);font-weight:700}
.sbtn{width:48px;height:48px;border-radius:50%;border:var(--bw) solid var(--lk);background:var(--sun);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--sd);transition:transform .1s;flex-shrink:0}
.sbtn:hover{animation:jelly .5s}
.sbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--sd)}
.acc{border:var(--bw) solid var(--lk);border-radius:28px;background:var(--pp);margin-bottom:20px;overflow:hidden;box-shadow:var(--sh)}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px;font-family:var(--fd);font-weight:800;font-size:clamp(19px,3vw,25px)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ci{width:48px;height:48px;flex-shrink:0;border-radius:16px;border:var(--bw) solid var(--lk);display:grid;place-items:center;font-size:24px;color:var(--ink)}
.acc>summary::after{content:"+";margin-left:auto;font-size:34px;font-weight:800;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.acc[open]>summary::after{transform:rotate(135deg)}
.acc[open]>summary{border-bottom:var(--bw) solid var(--lk)}
.bdy{padding:20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.bdy.one{display:block}
.it{border:var(--bw) solid var(--ln);border-radius:20px;padding:18px;background:var(--bg)}
.it h4{font-size:20px;margin-bottom:12px;line-height:1.2}
.fm{white-space:pre-line;background:#1B1340;color:#F5F2FF;border-radius:14px;padding:14px 16px;font-size:14.5px;margin-bottom:12px;line-height:1.75;border:2px solid #000}
.us{font-size:15.5px;margin-bottom:12px;white-space:pre-line}
.ex{border-left:5px solid var(--blue);padding-left:14px;font-style:italic;color:var(--mu);white-space:pre-line;font-size:15.5px}
[data-theme=dark] .ex{border-color:var(--sun)}
.tw{overflow-x:auto;border:var(--bw) solid var(--lk);border-radius:20px;background:var(--pp)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:440px}
th,td{padding:11px 15px;text-align:left;border-bottom:2px solid var(--ln)}

["5. Quá khứ đơn (Past Simple)","(+) S + V2/ed\n(–) S + did not + V\n(?) Did + S + V?\nTo be: was/were","Hành động đã xảy ra và kết thúc tại thời điểm xác định trong quá khứ; chuỗi hành động quá khứ.\nDấu hiệu: yesterday, last week, ago, in 2020, when I was a child.","I visited Hue last year.\nHe woke up, brushed his teeth and left."],
["6. Quá khứ tiếp diễn (Past Continuous)","(+) S + was/were + V-ing\n(–) S + was/were not + V-ing\n(?) Was/Were + S + V-ing?","Hành động đang diễn ra tại một thời điểm quá khứ; hành động đang diễn ra thì bị hành động khác xen vào; hai hành động song song.\nDấu hiệu: at 8 p.m. yesterday, while, when, all evening.","I was cooking when he called.\nWhile she was reading, he was playing games."],
["7. Quá khứ hoàn thành (Past Perfect)","(+) S + had + V3/ed\n(–) S + had not + V3/ed\n(?) Had + S + V3/ed?","Hành động xảy ra trước một hành động/thời điểm khác trong quá khứ.\nDấu hiệu: before, after, by the time, until, already, just, when.","When I arrived, the film had started.\nShe said she had finished."],
["8. Quá khứ hoàn thành tiếp diễn","(+) S + had been + V-ing\n(–) S + had not been + V-ing\n(?) Had + S + been + V-ing?","Nhấn mạnh quá trình kéo dài trước một mốc quá khứ khác.\nDấu hiệu: for, since, before, until then, by the time.","He had been working for 5 hours before he took a break."],
["9. Tương lai đơn (Future Simple)","(+) S + will + V\n(–) S + will not (won't) + V\n(?) Will + S + V?","Quyết định tức thời, dự đoán không căn cứ, lời hứa, đề nghị, đe dọa.\nDấu hiệu: tomorrow, next week, soon, probably, I think, I promise.","I'll help you.\nI think it will rain.\nI promise I won't be late."],
["10. Tương lai tiếp diễn","(+) S + will be + V-ing\n(–) S + will not be + V-ing\n(?) Will + S + be + V-ing?","Hành động sẽ đang diễn ra tại một thời điểm xác định trong tương lai; hỏi lịch sự về kế hoạch.\nDấu hiệu: at this time tomorrow, at 5 p.m. next Monday.","This time tomorrow I will be flying to Da Nang."],
["11. Tương lai hoàn thành","(+) S + will have + V3/ed\n(–) S + will not have + V3/ed\n(?) Will + S + have + V3/ed?","Hành động sẽ hoàn thành trước một mốc tương lai.\nDấu hiệu: by + mốc, by the time, before.","By 2030, I will have graduated.\nBy the time you come, I will have cooked."],
["12. Tương lai hoàn thành tiếp diễn","(+) S + will have been + V-ing\n(–) S + will not have been + V-ing\n(?) Will + S + have been + V-ing?","Nhấn mạnh thời gian kéo dài của hành động tính đến một mốc tương lai.\nDấu hiệu: by ... for + khoảng thời gian.","By next June, I will have been learning English for 3 years."],
["13. Tương lai gần (be going to)","S + am/is/are + going to + V","Dự định đã có từ trước; dự đoán dựa trên bằng chứng hiện tại.","Look at those clouds! It's going to rain.\nI'm going to study abroad."],
["14. Tương lai trong quá khứ","S + would / was/were going to + V","Diễn tả việc sẽ xảy ra tính từ một mốc quá khứ (thường dùng trong câu gián tiếp).","He said he would call me later."],
["15. Dùng thì hiện tại cho tương lai","Present Simple: lịch trình, thời gian biểu\nPresent Continuous: kế hoạch đã sắp xếp","The film starts at 8.\nWe are flying to Seoul on Friday."," "],
["16. Mệnh đề thời gian","if/when/as soon as/before/after/until/by the time + hiện tại đơn (không dùng will)\nSau when/after/before/as soon as trong quá khứ: dùng quá khứ đơn/hoàn thành","Hiện tại hoàn thành thay hiện tại đơn khi nhấn mạnh sự hoàn tất: As soon as I have finished, I'll call you.","I'll call you when I arrive.\nAfter she had eaten, she left."],
["17. Hiện tại hoàn thành vs Quá khứ đơn","Present Perfect: không nêu thời gian xác định, còn liên quan hiện tại\nPast Simple: có mốc thời gian đã qua","I have seen that film. (không rõ khi nào)\nI saw that film last night. (có mốc)"," "]
]),
c("form","Các dạng chia & quy tắc","🧩",[
["Quy tắc thêm -s / -es (V ngôi 3 số ít, danh từ số nhiều)","Thêm -es: tận cùng s, x, z, ch, sh, o\nPhụ âm + y → bỏ y thêm -ies\nNguyên âm + y → thêm -s\nf/fe → ves (leaf→leaves, knife→knives)","watch→watches; study→studies; play→plays; go→goes","Danh từ bất quy tắc: man→men, woman→women, child→children, foot→feet, tooth→teeth, mouse→mice, person→people, sheep→sheep, fish→fish."],
["Quy tắc thêm -ed (quá khứ / V3)","Thường: + ed (work→worked)\nTận cùng e: + d (live→lived)\nPhụ âm + y: y→ied (study→studied)\nNgắn 1 âm tiết CVC: gấp đôi phụ âm cuối (stop→stopped)\nNhiều âm tiết, nhấn âm cuối: gấp đôi (prefer→preferred)","Phát âm -ed: /t/ sau âm vô thanh (worked); /d/ sau âm hữu thanh (played); /id/ sau t, d (wanted, needed).","plan→planned; visit→visited (nhấn âm đầu, không gấp đôi)."],
["Quy tắc thêm -ing","Thường: + ing (work→working)\nTận cùng e câm: bỏ e (make→making)\nTận cùng ie: ie→ying (die→dying, lie→lying)\nCVC 1 âm tiết: gấp đôi (run→running, sit→sitting)\nTận cùng l sau nguyên âm đơn (Anh-Anh): travel→travelling","see→seeing (ee giữ nguyên); be→being; begin→beginning; open→opening.","Không dùng tiếp diễn với động từ trạng thái: know, like, love, want, need, believe, understand, belong, own, seem."],
["So sánh: quy tắc chính tả","Tính từ ngắn: + er / est (tall→taller→tallest)\nTận cùng e: + r / st (nice→nicer→nicest)\nCVC: gấp đôi (big→bigger→biggest)\nPhụ âm + y: ied (happy→happier→happiest)\nDài (≥ 3 âm tiết): more / most","Bất quy tắc: good→better→best; bad→worse→worst; far→farther(further)→farthest(furthest); little→less→least; many/much→more→most.","Hai âm tiết tận cùng -y, -er, -ow, -le thường thêm -er/-est (clever→cleverer)."],
["Hòa hợp chủ ngữ – động từ (Subject-Verb Agreement)","Chủ ngữ số ít + V số ít; số nhiều + V số nhiều\nA and B → số nhiều\nA or B / either A or B / neither A nor B → chia theo B (gần nhất)\nA as well as B / with / together with → chia theo A\nThe number of + N(số nhiều) → số ít; A number of + N(số nhiều) → số nhiều\nEveryone, someone, nobody, each, every + N → số ít\nNews, mathematics, physics, economics, politics → số ít","The police are here. (số nhiều)\nTwo hours is enough. (khoảng thời gian/tiền/khoảng cách → số ít)\nThe team is/are ... (tập thể: Anh-Mỹ số ít, Anh-Anh có thể số nhiều)"," "],
["Động từ to be / have / do","I am, you are, he/she/it is, we/they are | was/were | been\nI/you/we/they have, he/she/it has | had | had\nI/you/we/they do, he/she/it does | did | done","be: trạng thái, trợ động từ tiếp diễn/bị động\nhave: sở hữu, trợ động từ hoàn thành, have to\ndo: trợ động từ phủ định/nghi vấn, nhấn mạnh","I do like it! (nhấn mạnh)\nShe doesn't have a car."]
]),
c("ger","Danh động từ & động từ nguyên mẫu","🔀",[
["Động từ + V-ing (Gerund)","enjoy, avoid, finish, mind, suggest, practise, consider, keep, risk, admit, deny, delay, postpone, imagine, miss, escape, can't help, can't stand, give up, put off, carry on, go on, look forward to, be used to, feel like, it's no use, it's (not) worth, spend time/money","Sau giới từ luôn dùng V-ing. V-ing có thể làm chủ ngữ hoặc tân ngữ.","She enjoys swimming.\nSwimming is good for health.\nThank you for helping me."],
["Động từ + to V (Infinitive)","want, decide, hope, plan, agree, refuse, promise, manage, afford, learn, offer, seem, appear, pretend, expect, fail, choose, wish, would like, need, arrange, threaten, tend, happen, prepare, ask, tell + O + to V","Mục đích: to V = in order to V = so as to V. Sau adj: happy to, ready to, easy to.","I decided to leave.\nHe asked me to help him."],
["Động từ + V nguyên mẫu không to (Bare infinitive)","Sau modal (can, must, should...), let, make, had better, would rather, help (có thể có to), why not\nlet/make/have + O + V\nsee/hear/watch/notice + O + V (thấy trọn hành động) hoặc V-ing (đang diễn ra)","help + O + (to) V đều đúng.","She made me laugh.\nI saw him cross the street. / I saw him crossing the street."],
["Động từ đổi nghĩa theo V-ing / to V","stop + V-ing: ngừng làm; stop + to V: dừng lại để làm\nremember/forget + V-ing: nhớ/quên việc đã làm; + to V: nhớ/quên việc cần làm\nregret + V-ing: hối hận đã làm; + to V: tiếc phải báo\ntry + V-ing: thử; try + to V: cố gắng\ngo on + V-ing: tiếp tục; go on + to V: chuyển sang việc khác\nmean + V-ing: bao hàm; mean + to V: định\nneed + V-ing = need to be V3 (bị động)","","I stopped smoking.\nI stopped to smoke.\nI forgot to lock the door."],
["Động từ dùng được cả hai (nghĩa gần như nhau)","like, love, hate, prefer, begin, start, continue, intend, bother, can't bear","like to V: thói quen/lựa chọn; like V-ing: yêu thích chung.\nwould like/love/hate/prefer + to V","I like swimming / to swim.\nI'd like to go home."],
["Giới từ + V-ing","be interested in, be good at, be afraid of, be fond of, be tired of, be keen on, insist on, depend on, believe in, apologize for, thank for, succeed in, prevent from, stop from, look forward to, object to, be used to, in spite of, instead of, without, before, after, by","Be careful: look forward to / object to / be used to có 'to' là giới từ → V-ing.","I'm looking forward to seeing you.\nHe is good at drawing."],
["Tính từ + to V / cấu trúc với it","It + be + adj + (for O) + to V\nS + be + adj + to V (happy, glad, ready, willing, easy, difficult, afraid)\nIt takes (O) + time + to V\nIt's + noun + to V","too + adj + (for O) + to V\nadj + enough + (for O) + to V","It's important to sleep well.\nShe is too young to drive.\nHe is old enough to vote."],
["Phân từ (V-ing / V3) làm tính từ & rút gọn","V-ing: chủ động, đang diễn ra (a running man)\nV3: bị động, đã hoàn tất (a broken window)\nEmotion adj: -ing (gây ra cảm xúc) / -ed (cảm thấy)","boring / bored; interesting / interested; exciting / excited; tiring / tired","The film was boring, so I was bored."],
["Cấu trúc go + V-ing & các cụm với V-ing","go swimming, go shopping, go running, go fishing, go camping, go hiking, go dancing\nbusy + V-ing; waste time/money + V-ing; have difficulty/trouble + V-ing; it's no use + V-ing; there's no point in + V-ing; can't help + V-ing; be worth + V-ing","","We went camping last weekend.\nIt's no use crying."]
]),
c("cond","Câu điều kiện & ước muốn","🔮",[
["Loại 0 – Sự thật hiển nhiên","If + hiện tại đơn, hiện tại đơn","Quy luật tự nhiên, sự thật khoa học.","If you heat ice, it melts."],
["Loại 1 – Có thể xảy ra ở tương lai","If + hiện tại đơn, S + will/can/may/must + V","Điều kiện có thật, khả thi ở hiện tại/tương lai.","If it rains, we will stay home."],
["Loại 2 – Không có thật ở hiện tại","If + quá khứ đơn (were), S + would/could/might + V","Giả định trái với hiện tại. Dùng were cho mọi ngôi.","If I were you, I would study harder.\nIf I had money, I would travel."],
["Loại 3 – Không có thật ở quá khứ","If + quá khứ hoàn thành, S + would/could/might + have + V3","Giả định trái với quá khứ, nói về tiếc nuối.","If she had studied, she would have passed."],
["Câu điều kiện hỗn hợp (Mixed)","If + had V3 (quá khứ), S + would + V (hiện tại)\nIf + quá khứ đơn (hiện tại), S + would have V3 (quá khứ)","Điều kiện ở quá khứ → kết quả hiện tại, và ngược lại.","If I had taken that job, I would be rich now."],
["Đảo ngữ câu điều kiện","Loại 1: Should + S + V, ...\nLoại 2: Were + S + (to V), ...\nLoại 3: Had + S + V3, ...","Trang trọng, bỏ if.","Had I known, I would have told you.\nWere I rich, I would buy it.\nShould you need help, call me."],
["Từ thay thế if","unless = if ... not\nas long as / so long as / provided that / providing that / on condition that = nếu / miễn là\nin case = phòng khi\nsuppose / supposing = giả sử\nbut for + N = nếu không có\notherwise = nếu không thì","","Unless you hurry, you'll be late.\nI'll lend it as long as you return it."],
["Wish & If only","wish + quá khứ đơn → ước hiện tại\nwish + had V3 → ước quá khứ\nwish + would V → ước tương lai/phàn nàn\nIf only = wish (nhấn mạnh hơn)","","I wish I were taller.\nI wish I had studied.\nIf only it would stop raining!"]
]),
c("pas","Câu bị động (Passive Voice)","🔁",[
["Công thức tổng quát","S + be + V3/ed (+ by O)","Dùng khi người làm không quan trọng/không rõ, hoặc nhấn mạnh đối tượng chịu tác động.","The window was broken."],
["Bị động theo các thì","Hiện tại đơn: am/is/are + V3\nHiện tại tiếp diễn: am/is/are being + V3\nHiện tại hoàn thành: have/has been + V3\nQuá khứ đơn: was/were + V3\nQuá khứ tiếp diễn: was/were being + V3\nQuá khứ hoàn thành: had been + V3\nTương lai đơn: will be + V3\nTương lai hoàn thành: will have been + V3\nBe going to: is going to be + V3","","English is spoken worldwide.\nThe road is being repaired.\nThe report will be finished tomorrow."],
["Bị động với động từ khuyết thiếu","can/could/may/might/must/should + be + V3\nHiện tại hoàn thành: modal + have been + V3","","This must be done today.\nIt should have been cancelled."],
["Bị động với 2 tân ngữ","give, send, show, offer, tell, lend... → O1 hoặc O2 làm chủ ngữ","","She was given a gift. / A gift was given to her."],
["Bị động với have/get (Causative)","have + O + V3: nhờ ai làm gì\nget + O + V3\nhave + O + V: nhờ ai (chủ động)\nget + O + to V","","I had my car repaired.\nI got my hair cut.\nShe had him fix the sink."],
["Bị động tường thuật (Reporting passive)","It is said/believed/thought/reported that + clause\nS + is said/believed/thought + to V / to have V3","Dùng trong văn bản trang trọng, tin tức.","He is said to be rich.\nThey are believed to have left."],
["Bị động với V-ing & need","need + V-ing = need + to be V3\nbeing + V3 (đang bị)\nI hate being laughed at.","","The room needs cleaning."]
]),
c("rep","Câu gián tiếp (Reported Speech)","💬",[
["Lùi thì (Backshift)","hiện tại đơn → quá khứ đơn\nhiện tại tiếp diễn → quá khứ tiếp diễn\nhiện tại hoàn thành → quá khứ hoàn thành\nquá khứ đơn → quá khứ hoàn thành\nwill → would; can → could; may → might; must → had to/must","Không lùi thì khi động từ tường thuật ở hiện tại hoặc sự thật hiển nhiên.","\"I am tired.\" → She said she was tired."],
["Đổi trạng từ & đại từ","now → then; today → that day; tomorrow → the next day; yesterday → the day before; ago → before; next week → the following week; here → there; this → that; these → those","Đại từ đổi theo ngữ cảnh người nói.","\"I'll come tomorrow,\" he said. → He said he would come the next day."],
["Gián tiếp câu hỏi Yes/No","S + asked/wondered + if/whether + S + V (lùi thì, không đảo ngữ)","","\"Do you like tea?\" → She asked if I liked tea."],
["Gián tiếp câu hỏi Wh-","S + asked + wh-word + S + V (lùi thì)","","\"Where do you live?\" → He asked where I lived."],
["Gián tiếp câu mệnh lệnh / yêu cầu","tell/ask/order/advise/warn + O + (not) to V","","\"Close the door.\" → She told me to close the door."],
["Động từ tường thuật theo cấu trúc","admit/deny/suggest/apologize for/accuse of/insist on + V-ing\nagree/promise/offer/refuse/threaten + to V\nadvise/warn/remind/invite/encourage + O + to V\nsay/tell/explain/announce/complain + that","","He admitted breaking the vase.\nShe promised to call."]
]),
c("mod","Động từ khuyết thiếu (Modal Verbs)","🎛️",[
["can / could","can: khả năng, xin phép, khả năng xảy ra\ncould: khả năng quá khứ, xin phép lịch sự, giả định\nbe able to: thay thế ở mọi thì","can't + V: chắc chắn không (suy luận)","I can swim.\nCould you help me?"],
["may / might","may: xin phép trang trọng, có thể (50%)\nmight: có thể (thấp hơn), quá khứ gián tiếp","may/might + have V3: có lẽ đã","It might rain.\nShe may have left."],
["must / have to / mustn't / don't have to","must: bắt buộc chủ quan, suy luận chắc chắn\nhave to: bắt buộc khách quan\nmustn't: cấm\ndon't have to / needn't: không cần thiết","must have V3: chắc hẳn đã","You must be tired.\nI have to wear a uniform.\nYou mustn't smoke here."],
["should / ought to / had better","should/ought to: lời khuyên, bổn phận\nhad better + V: nên (cảnh báo hậu quả)\nshould have V3: lẽ ra đã nên (nhưng không)","","You should see a doctor.\nYou had better hurry.\nI should have called you."],
["will / would / shall","will: dự đoán, hứa, quyết định\nwould: thói quen quá khứ, đề nghị lịch sự, giả định\nshall: đề nghị (I/we), pháp lý","Would you like ...? / Would you mind + V-ing? / Shall we ...?","Every summer we would go to the sea.\nShall I open the window?"],
["need / dare","need: needn't + V (không cần); need to V (cần); need + V-ing (bị động)\ndare: dare to V; I daren't + V","","You needn't come.\nHow dare you!"],
["Modal perfect (suy đoán quá khứ)","must have V3: chắc chắn đã\ncan't/couldn't have V3: chắc chắn không\nmay/might/could have V3: có lẽ đã\nshould have V3: lẽ ra nên\nneedn't have V3: không cần mà đã làm","","He must have missed the bus."],
["Cấu trúc tương đương modal","be able to, be allowed to, be supposed to, be going to, be bound to, be likely to, be due to, be about to","","He is bound to win.\nI'm about to leave."]
]),
c("rel","Mệnh đề quan hệ","🔗",[
["Đại từ quan hệ cơ bản","who: người (chủ ngữ/tân ngữ)\nwhom: người (tân ngữ)\nwhich: vật\nthat: người/vật (mệnh đề xác định)\nwhose: sở hữu\nwhere: nơi chốn\nwhen: thời gian\nwhy: lý do","","The man who lives next door is a doctor.\nThe house where I was born is old."],
["Xác định & không xác định","Xác định (defining): cần thiết, không dấu phẩy, dùng được that\nKhông xác định (non-defining): thông tin thêm, có dấu phẩy, không dùng that","","My brother, who lives in Hanoi, is a pilot."],
["Lược bỏ đại từ quan hệ","Có thể bỏ who/which/that khi làm tân ngữ trong mệnh đề xác định.","","The book (that) I read was great."],
["Giới từ + quan hệ","preposition + whom/which (trang trọng)\nHoặc giới từ đặt cuối mệnh đề (thông dụng)","","The man to whom I spoke... / The man (who) I spoke to..."],
["Which thay cho cả mệnh đề","..., which + V: chỉ cả câu trước","","He passed the exam, which surprised everyone."],
["Rút gọn mệnh đề quan hệ","V-ing: chủ động\nV3: bị động\nto V: sau first, last, only, so sánh nhất\nBỏ who/which + be","","The girl standing there is my sister.\nThe book written by him is famous."],

const fx=e.target.closest(".btn,.tile,.pill,.sbtn,.dk,.skb");
if(fx)spark(e.clientX,e.clientY,5);
const t=e.target.closest("[data-go],[data-t],[data-sp],[data-topic],[data-auto],[data-streak]");

if(t.dataset.streak!==undefined)showStreak(streakState());

else if(t.dataset.topic!==undefined)startLearn(+t.dataset.topic);

});
document.addEventListener("keydown",e=>{

if(!L||!L.q.length||!$("#fc")||e.target.tagName==="INPUT")return;

if(e.key==="ArrowRight")$("#ok").click();
if(e.key==="ArrowLeft")$("#kb").click();
});
